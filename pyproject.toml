[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clarigrid"
version = "0.1.0"
description = "Unified interface for European energy market data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["energy", "ENTSO-E", "electricity", "power market", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",   # parquet cache
    "requests>=2.28",  # all built-in providers
]

[project.optional-dependencies]
entsoe = ["entsoe-py>=0.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pandas-stubs",
]

[project.scripts]
clarigrid = "clarigrid.cli:main"

[project.urls]
Homepage = "https://github.com/clarigrid/clarigrid"
Issues = "https://github.com/clarigrid/clarigrid/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
