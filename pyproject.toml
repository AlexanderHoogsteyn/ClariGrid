[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clarigrid"
version = "0.2.0"
description = "Unified interface for European and U.S. energy market data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["energy", "ENTSO-E", "EIA", "CAISO", "electricity", "power market", "data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pandas>=2.0",
    "requests>=2.28",  # all built-in providers
    # pyarrow is optional — cache gracefully degrades without it
]

[project.optional-dependencies]
cache  = ["pyarrow>=14.0"]
entsoe = ["entsoe-py>=0.6"]
all    = ["pyarrow>=14.0", "entsoe-py>=0.6"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "mypy",
    "pandas-stubs",
    "pyarrow>=14.0",  # needed to test cache
]

[project.scripts]
clarigrid = "clarigrid.cli:main"

[project.urls]
Homepage = "https://github.com/clarigrid/clarigrid"
Issues = "https://github.com/clarigrid/clarigrid/issues"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60           # per-test timeout in seconds (requires pytest-timeout)
markers = [
    "live: calls live external APIs; skip with -m 'not live'",
]
addopts = "-v"
filterwarnings = [
    # pytest-timeout config key warns when plugin not installed — ignore gracefully.
    "ignore::pytest.PytestConfigWarning",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
