name: Tests

on:
  push:
  pull_request:

jobs:
  # ── Main matrix: WITH pyarrow ────────────────────────────────────────────
  # Runs across all supported Python versions.
  # Cache tests execute normally; live tests (external APIs) are skipped.
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with cache support
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cache]"
          pip install pytest pytest-timeout

      - name: Run tests (no live API calls)
        run: |
          pytest -m "not live"

  # ── No-cache job: WITHOUT pyarrow ───────────────────────────────────────
  # Verifies graceful degradation when pyarrow is absent.
  # Cache tests with @skipif(not _PARQUET_OK) are skipped automatically.
  # test_cache_disabled_no_crash runs for real (no monkeypatching needed).
  test-no-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package without pyarrow
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-timeout

      - name: Run tests (no live API calls, cache tests auto-skip)
        run: |
          pytest -m "not live" -v