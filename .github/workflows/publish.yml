name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[cache]" pytest pytest-timeout
      - run: pytest -m "not live"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Verify installed wheel against release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os
          import tomllib
          from importlib.metadata import version
          from pathlib import Path
          import clarigrid
          from clarigrid.catalog import dataset_descriptors
          root = Path(os.environ["GITHUB_WORKSPACE"])
          source = tomllib.loads((root / "pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{source}"
          assert source == clarigrid.__version__ == version("clarigrid")
          assert dataset_descriptors()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/clarigrid
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  notify-hosted-mcp:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch hosted MCP sync
        env:
          GH_TOKEN: ${{ secrets.CLARIGRID_HUB_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh api --method POST repos/AlexanderHoogsteyn/clarigrid-energy-hub/dispatches \
            -f event_type=clarigrid-sdk-published -f "client_payload[version]=${RELEASE_TAG#v}"
